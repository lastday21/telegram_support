name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Ruff
        run: |
          uv run --frozen --all-extras ruff check app tests scripts
          uv run --frozen --all-extras ruff format --check app tests scripts

      - name: Mypy
        run: uv run --frozen --all-extras mypy --config-file mypy.ini app tests scripts

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Pytest
        run: uv run --frozen --all-extras pytest -q

  docker-build:
    needs:
      - lint
      - tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image for verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: smarthelper-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run and verify server container
        shell: bash
        run: |
          container_id=$(docker run --detach \
            --publish 127.0.0.1:18000:8000 \
            smarthelper-ci:${{ github.sha }})
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          status=starting
          for attempt in $(seq 1 45); do
            status=$(docker inspect \
              --format '{{.State.Health.Status}}' \
              "$container_id")
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "Container became unhealthy"
              exit 1
            fi
            sleep 1
          done

          test "$status" = "healthy"
          curl --fail --silent --show-error \
            http://127.0.0.1:18000/live

      - name: Create server image component list
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: smarthelper-ci:${{ github.sha }}
          format: spdx-json
          output: smarthelper-server.spdx.json

      - name: Upload server image component list
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SmartHelper-Server-SBOM
          path: smarthelper-server.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Check server image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: smarthelper-ci:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          skip-setup-trivy: true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha

      - name: Build and publish image
        id: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - name: Sign server image provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Sign server image component list
        if: github.event_name != 'pull_request'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: smarthelper-server.spdx.json
          push-to-registry: true

  desktop-build:
    needs:
      - lint
      - tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra client --no-dev --group build

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --version=8.1.2 --no-progress --yes
          $ffmpeg = (Get-Command ffmpeg -ErrorAction Stop).Source
          "FFMPEG_BINARY=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows application
        run: uv run --frozen --extra client --no-dev --group build pyinstaller --clean build.spec

      - name: Verify Windows application
        shell: pwsh
        run: |
          $executables = @(
            "dist/SmartHelper.exe",
            "dist/SmartHelperSettings.exe"
          )
          foreach ($executable in $executables) {
            $process = Start-Process `
              -FilePath $executable `
              -ArgumentList "--check" `
              -Wait `
              -PassThru `
              -WindowStyle Hidden
            if ($process.ExitCode -ne 0) {
              throw "$executable failed self-check with code $($process.ExitCode)"
            }
          }

      - name: Sign Windows application
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificateMissing = [string]::IsNullOrWhiteSpace(
            $env:WINDOWS_CERTIFICATE_BASE64
          ) -or [string]::IsNullOrWhiteSpace(
            $env:WINDOWS_CERTIFICATE_PASSWORD
          )
          if ($certificateMissing) {
            if ($env:GITHUB_REF -like "refs/tags/v*") {
              throw "Signing certificate is required for a release tag"
            }
            Write-Host "Signing certificate is not configured; skipping signing"
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "smarthelper-signing.pfx"
          try {
            $certificateBytes = [Convert]::FromBase64String(
              $env:WINDOWS_CERTIFICATE_BASE64
            )
            [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
            $signTool = Get-ChildItem `
              -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe `
              -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signTool) {
              throw "signtool.exe was not found"
            }
            Get-ChildItem -Path dist -Filter *.exe | ForEach-Object {
              & $signTool.FullName sign `
                /fd SHA256 `
                /f $certificatePath `
                /p $env:WINDOWS_CERTIFICATE_PASSWORD `
                /tr http://timestamp.digicert.com `
                /td SHA256 `
                $_.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to sign $($_.Name)"
              }
            }
          }
          finally {
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }

      - name: Create checksums
        shell: pwsh
        run: |
          $checksums = Get-ChildItem -Path dist -Filter *.exe |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
              "$($hash.ToLowerInvariant())  $($_.Name)"
            }
          $checksums | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SmartHelper-Windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
