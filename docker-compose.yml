services:
  server:
    image: ghcr.io/lastday21/telegram_support:latest
    build:
      context: .
    env_file:
      - .env
      - .env.access
    ports:
      - "${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-8000}:8000"
    restart: unless-stopped

  telegram-bot:
    image: ghcr.io/lastday21/telegram_support:latest
    build:
      context: .
    env_file:
      - .env
      - .env.access
    command: ["python", "-m", "app.interfaces.telegram.bot"]
    restart: unless-stopped
