repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --all-extras ruff check app tests scripts
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --all-extras ruff format --check app tests scripts
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: mypy
        name: mypy
        entry: uv run --frozen --all-extras mypy --config-file mypy.ini app tests scripts
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: uv run --frozen --all-extras pytest -q
        language: system
        pass_filenames: false
        stages: [pre-commit]
