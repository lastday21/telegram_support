repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check app tests
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format
        entry: python -m ruff format --check app tests
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: mypy
        name: mypy
        entry: python -m mypy --config-file mypy.ini app tests
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: python -m pytest -q --basetemp=.pytest-temp-pre-commit
        language: system
        pass_filenames: false
        stages: [pre-commit]
