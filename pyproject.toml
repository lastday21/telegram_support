[project]
name = "smarthelper"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv~=1.1.0",
    "requests~=2.32.3",
]

[project.optional-dependencies]
client = [
    "keyboard~=0.13.5",
    "mss~=10.0.0",
    "pillow~=11.2.1",
]
server = [
    "fastapi~=0.139.2",
    "python-multipart~=0.0.20",
    "python-telegram-bot~=22.1",
    "uvicorn~=0.35.0",
]

[dependency-groups]
dev = [
    "mypy~=1.19.1",
    "pre-commit~=4.5.0",
    "pytest~=8.4.1",
    "ruff~=0.12.5",
    "types-requests~=2.32.4",
]
build = [
    "pyinstaller~=6.21.0",
]

[tool.uv]
package = false
required-version = ">=0.11.28,<0.12"
